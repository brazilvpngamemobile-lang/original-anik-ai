<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Anik AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg: #ffffff; --sidebar-bg: #f9f9f9; --border: #e5e5e5; --text-main: #111111; --text-muted: #888888; --primary: #000000; --msg-user: #f4f4f5; --danger: #ef4444; --success: #22c55e;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
body{color:var(--text-main);display:flex;height:100vh;height:100dvh;overflow:hidden;background-color:var(--bg)}
.sidebar{width:260px;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px;transition:transform .3s ease;z-index:100;height:100%}
.sidebar-header{display:flex;align-items:center;gap:10px;margin-bottom:20px;padding:4px}
.logo{width:28px;height:28px;background:#000;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:14px}
.brand{font-size:1rem;font-weight:600;color:var(--text-main)}
.new-chat-btn{width:100%;padding:10px;background:#fff;border:1px solid var(--border);color:var(--text-main);border-radius:10px;font-weight:500;font-size:0.9rem;cursor:pointer;display:flex;align-items:center;gap:10px;justify-content:center;transition:all .2s;box-shadow:0 1px 2px rgba(0,0,0,0.02)}
.new-chat-btn:hover{background:var(--sidebar-bg);border-color:#d4d4d8}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.2);opacity:0;pointer-events:none;transition:opacity 0.3s;z-index:99}
.overlay.active{opacity:1;pointer-events:auto}
.main{flex:1;display:flex;flex-direction:column;position:relative;height:100%;width:100%;background:var(--bg)}
header{display:flex;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--bg);position:absolute;top:0;width:100%;z-index:10}
.header-left{display:flex;align-items:center;gap:12px}
.menu-btn{display:none;background:transparent;border:none;font-size:1.2rem;color:var(--text-main);cursor:pointer;padding:4px}
.header-title{font-size:0.95rem;color:var(--text-main);font-weight:500;display:flex;align-items:center;gap:8px}
#chat-container{flex:1;overflow-y:auto;padding:80px 24px 120px 24px;display:flex;flex-direction:column;gap:28px;scroll-behavior:smooth;max-width:800px;margin:0 auto;width:100%}
#chat-container::-webkit-scrollbar{width:4px}
#chat-container::-webkit-scrollbar-thumb{background:#e5e5e5;border-radius:4px}
.message-row{display:flex;width:100%;gap:16px;animation:fadeIn .3s ease forwards;opacity:0}
@keyframes fadeIn{to{opacity:1}}
.message-row.user{flex-direction:row-reverse}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;margin-top:2px;}
.avatar.ai{background:#f4f4f5;border:1px solid var(--border);color:#000}
.avatar.user{background:#000;color:#fff}
.message-content{display:flex;flex-direction:column;max-width:85%;line-height:1.6;font-size:0.95rem}
.message-row.user .message-content{align-items:flex-end}
.message{padding:8px 0;word-wrap:break-word;white-space:pre-wrap;word-break:break-word;}
.ai .message{background:transparent;color:var(--text-main);}
.user .message{background:var(--msg-user);color:var(--text-main);border-radius:12px;padding:10px 16px;}
#input-container{position:absolute;bottom:0;left:0;width:100%;padding:20px 24px;background:linear-gradient(to top, var(--bg) 60%, transparent);display:flex;justify-content:center;z-index:10}
#input-area{display:flex;align-items:center;gap:8px;width:100%;max-width:760px;background:#fff;padding:8px 12px 8px 16px;border-radius:20px;border:1px solid var(--border);box-shadow:0 4px 25px rgba(0,0,0,0.06);transition:all .2s}
#input-area:focus-within{border-color:#d4d4d8;box-shadow:0 4px 30px rgba(0,0,0,0.1)}
textarea{flex:1;min-width:0;padding:6px 0;border:none;background:transparent;color:var(--text-main);font-size:15px;outline:none;resize:none;max-height:150px;font-family:'Inter',sans-serif;line-height:1.5}
textarea::placeholder{color:var(--text-muted)}
textarea:disabled{opacity: 0.5;}
button.action-btn{display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;transition:all .2s;flex-shrink:0;border-radius:50%;width:32px;height:32px}
.teach-btn{background:transparent;color:var(--text-muted);font-size:1rem;margin-right: 4px;}
.teach-btn:hover{color:var(--text-main);background:#f4f4f5}
.mic-btn{background:#f4f4f5;color:var(--text-muted);font-size:0.95rem;}
.mic-btn:hover{color:var(--text-main);background:#e4e4e7;}
.mic-btn.active{background:var(--danger);color:#fff;animation:pulse 1.5s infinite;}
@keyframes pulse{0%{transform:scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);}70%{transform:scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);}100%{transform:scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);}}
.send-btn{background:#000;color:#fff;font-size:0.85rem}
.send-btn:hover{background:#333;transform:scale(1.05)}
.send-btn:disabled{background:#e4e4e7;color:#a1a1aa;cursor:not-allowed;transform:none}
.typing-indicator{display:flex;align-items:center;gap:4px;height:24px}
.typing-indicator span{width:4px;height:4px;background-color:var(--text-muted);border-radius:50%;animation:bounce 1.4s infinite ease-in-out both}
.typing-indicator span:nth-child(1){animation-delay:-0.32s}
.typing-indicator span:nth-child(2){animation-delay:-0.16s}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:#000;color:#fff;padding:8px 16px;border-radius:8px;font-size:0.85rem;font-weight:500;transition:all .3s;z-index:1001;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media (max-width:768px){.sidebar{position:fixed;left:-260px;top:0;bottom:0;box-shadow:2px 0 15px rgba(0,0,0,0.05)} .sidebar.open{transform:translateX(260px)} .menu-btn{display:block} header{padding:12px 16px} #chat-container{padding:70px 16px 100px 16px;gap:24px} #input-container{padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))} .message-content{max-width:90%} #input-area{border-radius:16px;}}
</style>
</head>
<body>
<div id="toast"></div>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header"><div class="logo">A</div><div class="brand">Anik AI</div></div>
  <button class="new-chat-btn" onclick="clearChat(); toggleSidebar();"><i class="fa-solid fa-plus"></i> New Chat</button>
</div>
<div class="main">
  <header>
    <div class="header-left">
      <button class="menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <div class="header-title">Anik AI</div>
    </div>
  </header>
  <div id="chat-container">
    <div class="message-row ai">
      <div class="avatar ai"><i class="fa-solid fa-robot"></i></div>
      <div class="message-content">
        <div class="message">স্বাগতম! আমি অনিক এআই। আপনি মাইকে (🎤) একবার ক্লিক করে কথা বলা শুরু করুন। আমি উত্তর শেষ করে আপনাকে আবার শুনতে শুরু করব।</div>
      </div>
    </div>
  </div>
  <div id="input-container">
    <div id="input-area">
      <button class="action-btn teach-btn" onclick="teachAI()" title="Teach AI"><i class="fa-solid fa-graduation-cap"></i></button>
      <textarea id="user-input" placeholder="Ask anything..." rows="1" onkeypress="handleKeyPress(event)" oninput="autoResize(this)"></textarea>
      <button class="action-btn mic-btn" id="mic-btn" onclick="toggleContinuousVoice()" title="Start/Stop Voice Mode"><i class="fa-solid fa-microphone"></i></button>
      <button class="action-btn send-btn" onclick="sendMessage()" id="send-btn"><i class="fa-solid fa-arrow-up"></i></button>
    </div>
  </div>
</div>
<script>
const chatContainer = document.getElementById('chat-container');
const inputField = document.getElementById('user-input');
const toast = document.getElementById('toast');
const sendBtn = document.getElementById('send-btn');
const micBtn = document.getElementById('mic-btn');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
let toastTimeout, chatHistory = [], isBusy = false;
let continuousMode = false;

// voices লোড হতে পারে التأخيرে
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => {};
}

function pickBengaliLang() {
  if (!('speechSynthesis' in window)) return 'bn-IN';
  const voices = window.speechSynthesis.getVoices();
  const bnLangs = ['bn-BD', 'bn-IN', 'bn'];
  for (const lang of bnLangs) {
    if (voices.some(v => v.lang && v.lang.toLowerCase().startsWith(lang.toLowerCase()))) {
      return lang;
    }
  }
  return 'bn-IN';
}

function speak(text) {
  if (!continuousMode || !('speechSynthesis' in window)) return;
  let cleanText = text.replace(/[\*\#\_\`\•]/g, '');
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(cleanText);
  utterance.lang = pickBengaliLang();
  utterance.rate = 0.95;
  const voices = window.speechSynthesis.getVoices();
  const bnVoice = voices.find(v => v.lang && (v.lang.startsWith('bn') || v.lang.includes('BD')));
  if (bnVoice) utterance.voice = bnVoice;
  utterance.onend = () => {
    if (continuousMode && !isBusy) startListening();
  };
  window.speechSynthesis.speak(utterance);
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = pickBengaliLang();

  recognition.onstart = () => { if (continuousMode) micBtn.classList.add('active'); };
  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    inputField.value = transcript;
    autoResize(inputField);
    sendMessage();
  };
  recognition.onerror = (event) => {
    micBtn.classList.remove('active');
    if (event.error !== 'no-speech') {
      showToast('ভয়েস শোনা যায়নি, আবার চেষ্টা করুন।');
      if (continuousMode) continuousMode = false;
    }
  };
  recognition.onend = () => {
    if (continuousMode) {
      setTimeout(() => { if (continuousMode && !isBusy) startListening(); }, 300);
    } else {
      micBtn.classList.remove('active');
    }
  };
}

function startListening() {
  if (!recognition) { showToast('আপনার ব্রাউজার ভয়েস সাপোর্ট করে না।'); return; }
  if (isBusy) return;
  window.speechSynthesis.cancel();
  try { recognition.start(); } catch (e) {}
}

function toggleContinuousVoice() {
  if (!recognition) { showToast('আপনার ব্রাউজার ভয়েস সাপোর্ট করে না।'); return; }
  continuousMode = !continuousMode;
  if (continuousMode) {
    micBtn.classList.add('active');
    showToast('ভয়েস মোড চালু হয়েছে। কথা বলুন...');
    startListening();
  } else {
    micBtn.classList.remove('active');
    showToast('ভয়েস মোড বন্ধ হয়েছে।');
    window.speechSynthesis.cancel();
    try { recognition.stop(); } catch (e) {}
  }
}

function toggleSidebar() { sidebar.classList.toggle('open'); overlay.classList.toggle('active'); }
function typeWriter(element, text, speed = 15) {
  return new Promise(resolve => {
    element.textContent = '';
    let i = 0;
    function type() {
      if (i < text.length) {
        element.textContent += text.charAt(i);
        i++;
        chatContainer.scrollTop = chatContainer.scrollHeight;
        setTimeout(type, Math.max(5, speed));
      } else { resolve(); }
    }
    type();
  });
}
function autoResize(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = (textarea.scrollHeight) + 'px';
  if (textarea.value === '') textarea.style.height = 'auto';
}
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
}
function clearChat() {
  chatContainer.innerHTML = '<div class="message-row ai"><div class="avatar ai"><i class="fa-solid fa-robot"></i></div><div class="message-content"><div class="message">স্বাগতম! আমি অনিক এআই।</div></div></div>';
  chatHistory = [];
}
function appendMessage(role, text, isTyping = false) {
  const row = document.createElement('div');
  row.className = 'message-row ' + role;
  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + role;
  avatar.innerHTML = role === 'ai' ? '<i class="fa-solid fa-robot"></i>' : '<i class="fa-solid fa-user"></i>';
  const contentDiv = document.createElement('div');
  contentDiv.className = 'message-content';
  const msgDiv = document.createElement('div');
  msgDiv.className = 'message';
  if (isTyping) {
    msgDiv.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
  } else {
    msgDiv.textContent = text;
  }
  contentDiv.appendChild(msgDiv);
  row.appendChild(avatar);
  row.appendChild(contentDiv);
  chatContainer.appendChild(row);
  chatContainer.scrollTop = chatContainer.scrollHeight;
  return msgDiv;
}

async function sendMessage() {
  if (isBusy) return;
  const message = inputField.value.trim();
  if (!message) return;

  isBusy = true;
  inputField.disabled = true;
  sendBtn.disabled = true;
  micBtn.classList.remove('active');

  appendMessage('user', message);
  chatHistory.push(message);
  if (chatHistory.length > 40) chatHistory = chatHistory.slice(-40);

  inputField.value = '';
  inputField.style.height = 'auto';
  const aiMsgDiv = appendMessage('ai', '', true);

  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: message, history: chatHistory })
    });
    const data = await res.json();
    setTimeout(async () => {
      await typeWriter(aiMsgDiv, data.reply);
      inputField.disabled = false;
      sendBtn.disabled = false;
      isBusy = false;
      speak(data.reply);
    }, 600);
  } catch (e) {
    aiMsgDiv.textContent = 'সার্ভার সংযোগে সমস্যা হয়েছে।';
    inputField.disabled = false;
    sendBtn.disabled = false;
    isBusy = false;
  }
}

async function teachAI() {
  if (isBusy) return;
  const fact = inputField.value.trim();
  if (!fact) { showToast("প্রথমে একটি তথ্য লিখুন!"); return; }
  isBusy = true;
  inputField.disabled = true;
  appendMessage('user', '[Teaching] ' + fact);
  inputField.value = '';
  inputField.style.height = 'auto';
  const aiMsgDiv = appendMessage('ai', '', true);
  try {
    const res = await fetch('/teach', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fact: fact })
    });
    const data = await res.json();
    setTimeout(async () => {
      await typeWriter(aiMsgDiv, data.reply);
      inputField.disabled = false;
      isBusy = false;
      speak(data.reply);
    }, 600);
  } catch (e) {
    aiMsgDiv.textContent = 'সার্ভার সংযোগে সমস্যা হয়েছে।';
    inputField.disabled = false;
    isBusy = false;
  }
}

function handleKeyPress(event) {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}
</script>
</body>
</html>
